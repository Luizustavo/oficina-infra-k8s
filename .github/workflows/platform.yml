name: Platform

# Aplica no cluster os manifestos de plataforma (k8s/platform/): namespaces
# e, a partir da etapa 2, o RabbitMQ. Roda:
#   - quando k8s/platform/ muda na main;
#   - logo depois de um apply bem-sucedido do workflow Terraform, que é quando
#     o cluster nasce de novo a cada sessão de trabalho;
#   - sob demanda.
on:
  push:
    branches: [main]
    paths:
      - 'k8s/platform/**'
      - '.github/workflows/platform.yml'
  workflow_run:
    workflows: ["Terraform"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: platform-k8s
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: sa-east-1
  K3S_NODE_TAG: oficina-backend-k3s-node

jobs:
  apply:
    name: Apply platform manifests
    runs-on: ubuntu-latest
    # Depois de um destroy o workflow Terraform também termina com sucesso;
    # nesse caso o passo "Find the k3s node" percebe que não há nó e encerra
    # sem erro.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the k3s node
        id: node
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${K3S_NODE_TAG}" "Name=instance-state-name,Values=pending,running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "::notice::Nenhum nó k3s ligado (infra destruída). Nada a aplicar."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)

          echo "Found $INSTANCE_ID at $PUBLIC_IP"
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_ENV"
          echo "found=true" >> "$GITHUB_OUTPUT"

      # Logo após o apply o nó ainda está instalando o k3s. Espera o agente do
      # SSM registrar e o k3s gerar o kubeconfig, em vez de falhar na hora.
      - name: Wait for k3s and fetch kubeconfig via SSM
        if: steps.node.outputs.found == 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            PING=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query "InstanceInformationList[0].PingStatus" --output text 2>/dev/null || true)
            [ "$PING" = "Online" ] && break
            echo "SSM ainda não registrou o nó (tentativa $i/30)…"; sleep 10
          done
          [ "$PING" = "Online" ] || { echo "::error::SSM não ficou Online em 5 min"; exit 1; }

          for i in $(seq 1 30); do
            CMD_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["cat /etc/rancher/k3s/k3s.yaml"]' \
              --query "Command.CommandId" --output text)
            aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" 2>/dev/null || true
            KUBECONFIG_CONTENT=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "StandardOutputContent" --output text)
            if echo "$KUBECONFIG_CONTENT" | grep -q "server:"; then
              echo "$KUBECONFIG_CONTENT" | sed "s/127.0.0.1/${PUBLIC_IP}/" > "${RUNNER_TEMP}/kubeconfig.yaml"
              echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig.yaml" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "k3s ainda instalando (tentativa $i/30)…"; sleep 10
          done
          echo "::error::kubeconfig do k3s não apareceu em 5 min"; exit 1

      - uses: azure/setup-kubectl@v4
        if: steps.node.outputs.found == 'true'
        with:
          version: 'latest'

      - name: Wait for the node to be Ready
        if: steps.node.outputs.found == 'true'
        run: kubectl wait --for=condition=Ready node --all --timeout=300s

      # A senha do RabbitMQ não pode ir para o git, e o cluster nasce do zero a
      # cada sessão. Por isso o Secret é recriado aqui, a partir de um secret
      # do GitHub, sempre com a mesma senha que os serviços usam.
      - name: Create RabbitMQ credentials
        if: steps.node.outputs.found == 'true'
        env:
          RABBITMQ_USER: oficina
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${RABBITMQ_PASSWORD}" ]; then
            echo "::error::Secret RABBITMQ_PASSWORD não configurado no ambiente production. Veja a seção RabbitMQ do README."
            exit 1
          fi
          kubectl apply -f k8s/platform/namespaces.yaml
          kubectl create secret generic rabbitmq-credentials -n messaging \
            --from-literal=username="${RABBITMQ_USER}" \
            --from-literal=password="${RABBITMQ_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply platform manifests
        if: steps.node.outputs.found == 'true'
        run: kubectl apply -R -f k8s/platform/

      - name: Wait for RabbitMQ
        if: steps.node.outputs.found == 'true'
        run: kubectl rollout status statefulset/rabbitmq -n messaging --timeout=300s

      # O Traefik é configurado pelo user-data do nó (k3s-user-data.sh.tpl),
      # não por este workflow. Aqui só se confirma que a porta de entrada
      # ficou como o API Gateway espera.
      - name: Check cluster entrypoint (Traefik)
        if: steps.node.outputs.found == 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            TYPE=$(kubectl get svc traefik -n kube-system -o jsonpath='{.spec.type}' 2>/dev/null || true)
            PORT=$(kubectl get svc traefik -n kube-system -o jsonpath='{.spec.ports[?(@.name=="web")].nodePort}' 2>/dev/null || true)
            if [ "$TYPE" = "NodePort" ] && [ "$PORT" = "30080" ]; then
              echo "Traefik em NodePort 30080 ✔"
              kubectl get svc traefik -n kube-system
              exit 0
            fi
            echo "Traefik ainda não está em NodePort 30080 (type=${TYPE:-?} port=${PORT:-?}), tentativa $i/30…"; sleep 10
          done
          echo "::error::Traefik não ficou em NodePort 30080. Veja: kubectl get helmchartconfig,svc -n kube-system"
          exit 1

      - name: Summary
        if: steps.node.outputs.found == 'true'
        run: |
          {
            echo "### Plataforma aplicada"
            echo '```'
            kubectl get ns
            echo
            kubectl get svc -n kube-system traefik
            echo
            kubectl get pods,svc,pvc -n messaging
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
