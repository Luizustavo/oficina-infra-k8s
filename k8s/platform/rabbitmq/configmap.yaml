# Configuração do RabbitMQ (ADR-010). Entra como um arquivo extra em
# /etc/rabbitmq/conf.d/, somado ao 10-defaults.conf que já vem na imagem.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: messaging
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: oficina
data:
  20-oficina.conf: |
    # Sem esta linha o RabbitMQ calcula a memória a partir do nó inteiro
    # (4 GB), e não do limite do container. Tem que bater com
    # resources.limits.memory do StatefulSet.
    total_memory_available_override_value = 512MiB

    # Acima de 60% disso (~307 MiB) o broker para de aceitar publicações até
    # os consumidores esvaziarem as filas, em vez de ser morto por falta de
    # memória (OOMKilled).
    vm_memory_high_watermark.relative = 0.6

    # Mesma lógica para o disco: o volume tem 2 GiB.
    disk_free_limit.absolute = 200MB

  # Substitui o arquivo da imagem, que liga só management e prometheus. O
  # shovel permite reprocessar a DLQ pelo painel (Queues > fila .dlq > Move
  # messages); ver docs/arquitetura/operacao-da-mensageria.md no oficina-backend.
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus,rabbitmq_shovel,rabbitmq_shovel_management].
